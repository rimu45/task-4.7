<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <div class="first-box">
            <img class="bg" src="img/bg.jpg" alt="">
            <img class="iintoo" src="img/logo.svg" alt="logo">
        </div>
        <div class=second-box>
            <div class="get">Get iintoo it today</div>
            <div class="registration">There is no charge or obligation upon registration.</div>
            <div class="buttons">
                <button class="facebook">
                    <img class="fb-logo" src="img/facebook.svg" alt="">
                    <span>Register with facebook</span>
                </button>
                <button class="link">
                    <img class="link-logo" src="img/linkedin.svg" alt="">
                    <span>Register with LinkedIn</span>
                </button>
            </div>
            <div class="lines">
                <div class="line"></div>
                <div class="or">OR</div>
                <div class="line"></div>
            </div>
            <div class="contacts">
                <div class="email">
                    Email <div class="goodwin">gus.goodwin@gmail.com</div>
                </div>
                <div class="phone">
                    Phone
                </div>
            </div>
            <div class="question">What type of investor are you?</div>
            <div class="select">Select the type of investor you are below.</div>
            <div class="types">
               <div class="i">
                <input class="custom-radio" type="radio" id="individual" name="investor-type" checked>
                <label for="">Individual</label>
                <div class="span">i</div>
               </div>
               <div class="i">
                <input class="custom-radio" type="radio" id="individual" name="investor-type">
                <label for="">Business </label>
                <div class="span">i</div>
               </div>
               <div class="i">
                <input class="custom-radio" type="radio" id="individual" name="investor-type">
                <label for="">IRA</label>
                <div class="span">i</div>
               </div>
               <div class="i">
                <input class="custom-radio" type="radio" id="individual" name="investor-type">
                <label for="Trust">Trust</label>
                <div class="span">i</div>
               </div>
            </div>
            <div class="person">I am natural person investing on my own behalf as a sole owner, joint tenant or tenant in common.</div>
            <input type="checkbox" id="terms">
            <label class="terms" for="">I agree to the terms and receiving notifications from iintoo <a href="https::/google.com">View full terms</a></label>
            <button class="account">Create Account</button>
            
        </div>
        
    </div>
</body>
</html>
